name: Claude agent (fix)

# THIN CALLER STUB -- the actual agent logic is a reusable workflow that
# lives centrally in sherlock, NOT here:
#   GIVA-Jewellery/sherlock/.github/workflows/claude-debug.yml
# This file only needs to change if THIS repo's dispatch types or per-repo
# config knobs change. Every other change (prompt tweaks, new MCPs, bug
# fixes in the agent's logic) takes effect the moment sherlock's reusable
# workflow changes -- no redeploy to this repo, ever.
#
# Pinned to @main: this repo always runs sherlock's LATEST agent logic. A bad
# change to that reusable workflow affects this repo's very next run.
#
# REQUIRES (one-time, done by sherlock's admins, not per target repo):
# sherlock's Settings -> Actions -> General -> Access must allow this org's
# repos to use its reusable workflows, or the `uses:` call below fails.
#
# Per-repo tuning knobs (set as repo Variables / Secrets, no YAML edits needed
# beyond this file):
#   vars.AGENT_RUNNER     - self-hosted runner label (default: ubuntu-latest)
#   vars.AGENT_BASE_REF   - branch to check out & branch off (default: repo default branch)
#   vars.AGENT_TEST_CMD   - optional; a test command hint surfaced to the agent
#   vars.GOPRIVATE        - optional; private Go module prefix override
#   vars.SIGNOZ_URL / vars.NETBIRD_MANAGEMENT_URL - optional overrides
#   secrets.CLAUDE_CODE_OAUTH_TOKEN - required, Claude Code auth
#   secrets.DISPATCH_TOKEN - required, PAT with issues:write on the sherlock queue
#                            repo (to comment + relabel back). Shared with the
#                            dispatcher; must be visible to this repo (org secret).
#   secrets.BOT_GITHUB_TOKEN - read token exposed to Claude for cross-repo context.
#   secrets.MONGO_READONLY_URI / POSTGRES_READONLY_URI - optional read-only DB
#     connection strings. Each enables a read-only MCP server for diagnosis.
#   secrets.SIGNOZ_API_KEY - optional; enables SigNoz MCP (logs/traces/metrics).
#   secrets.PROD_GITHUB_ACTIONS_NETBIRD_SETUP_KEY - NetBird setup key. Required
#     when POSTGRES_READONLY_URI or SIGNOZ_API_KEY is set (both behind VPN).

on:
  repository_dispatch:
    # fix-request = two-phase bug model (carries a central RCA to implement).
    # feature-plan-request = cross-repo feature plan model (carries this repo's
    # plan_slice). bug-report / feature-request kept for backward compatibility.
    types: [fix-request, feature-plan-request, bug-report, feature-request]

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required by anthropics/claude-code-action (OIDC)

# Deliberately NO `concurrency:` block here -- the reusable workflow already
# declares one on the same group name. Declaring it on BOTH the caller and
# the called reusable workflow deadlocks ("Canceling since a deadlock was
# detected for concurrency group ... between a top level workflow and
# 'debug'") because the caller run holds the group while waiting on the job
# that needs the same group to start. One declaration (in the reusable
# workflow) is sufficient.

jobs:
  debug:
    uses: GIVA-Jewellery/sherlock/.github/workflows/claude-debug.yml@main
    secrets: inherit
    with:
      source_issue_url: ${{ github.event.client_payload.source_issue_url }}
      source_issue_number: ${{ github.event.client_payload.source_issue_number }}
      title: ${{ github.event.client_payload.title }}
      body: ${{ github.event.client_payload.body }}
      rca: ${{ github.event.client_payload.rca }}
      plan_slice_json: ${{ toJSON(github.event.client_payload.plan_slice) }}
      work_kind: ${{ github.event.client_payload.kind || 'bug' }}
      # GitHub-hosted by default (has unzip/gh/git/node preinstalled). For repos
      # that need a private toolchain/network, set the AGENT_RUNNER repo variable
      # to a self-hosted runner label.
      runner: ${{ vars.AGENT_RUNNER || 'ubuntu-latest' }}
      base_ref: ${{ vars.AGENT_BASE_REF || github.event.repository.default_branch }}
      test_cmd: ${{ vars.AGENT_TEST_CMD }}
      goprivate: ${{ vars.GOPRIVATE || 'github.com/giva-jewellery/*' }}
      signoz_url: ${{ vars.SIGNOZ_URL || 'https://signoz-v2.internal.givadiva.co' }}
      netbird_management_url: ${{ vars.NETBIRD_MANAGEMENT_URL || 'https://netbird.givadiva.co' }}
